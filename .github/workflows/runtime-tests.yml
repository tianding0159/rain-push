name: runtime-v7-tests

# Single source of truth: the reviewable engine source tree at runtime/v7/engine/.
# runtime/v7/engine.manifest.json is the authoritative 68-file SHA-256 inventory of that
# tree, produced deterministically by runtime/v7/build-engine-archive.mjs, which packages
# it into the deterministic engine archive (runtime/v7/dist/rain-push-v7-engine.zip).
#
# The root blob rain-push-v7-claude-handoff.zip is a FROZEN legacy spec + handoff bundle
# (Option B, P0-0B). It is a historical snapshot: it can NOT be deterministically rebuilt
# from current tracked source + current builder (see runtime/v7/legacy-bundle/), so it no
# longer follows runtime changes and is NOT parity-checked against the live engine.
# Instead it is pinned by identity in legacy-bundle/legacy-bundle.lock.json and guarded
# for tampering.
#
# Three jobs:
#   - engine-source-ssot   : the authority. Runs engine tests from the reviewable source,
#     the builder contract + inventory tests, proves the manifest is current, and proves
#     the generated engine archive round-trips the manifest 68/68 via the parity module.
#   - legacy-bundle-frozen : identity + consumability guard. Verifies the root ZIP
#     byte-for-byte against legacy-bundle.lock.json (existence, size, SHA-256, git blob
#     SHA-1, entry counts, lock version + lock-contract invariants), runs the verifier's
#     adversarial suite, and proves the frozen bundle still unpacks to a runnable engine
#     (embedded historical engine 228/0). It does NOT restore parity with the live engine.
#   - corpus-contracts     : the P0-A corpus contract. Runs fully offline with no
#     production engine deps: schema meta-validation, the cross-record validator tests,
#     migration + deterministic import/export tests, privacy/export leak tests, filesystem
#     safety + CLI exit-code tests, and the negative/adversarial suite; then re-runs the
#     migration + export tools and asserts a clean working tree (deterministic, no drift).

on:
  push:
    branches: [main]
    paths:
      - "rain-push-v7-claude-handoff.zip"
      - "runtime/v7/engine/**"
      - "runtime/v7/engine.manifest.json"
      - "runtime/v7/build-engine-archive.mjs"
      - "runtime/v7/verify-engine-bundle-parity.mjs"
      - "runtime/v7/tests/**"
      - "runtime/v7/legacy-bundle/**"
      - "runtime/v7/corpus/**"
      - ".github/workflows/runtime-tests.yml"
  pull_request:
    paths:
      - "rain-push-v7-claude-handoff.zip"
      - "runtime/v7/engine/**"
      - "runtime/v7/engine.manifest.json"
      - "runtime/v7/build-engine-archive.mjs"
      - "runtime/v7/verify-engine-bundle-parity.mjs"
      - "runtime/v7/tests/**"
      - "runtime/v7/legacy-bundle/**"
      - "runtime/v7/corpus/**"
      - ".github/workflows/runtime-tests.yml"
  workflow_dispatch:

jobs:
  # The authority. The reviewable engine source at runtime/v7/engine/ is the single
  # source of truth. This job runs its tests directly from the checked-out tree (not the
  # zip), runs the builder's metadata + symlink contract tests and the legacy-bundle
  # inventory/lock tests, proves the committed manifest is current, then proves the
  # deterministic archive contract: regenerating the manifest (to a scratch path)
  # reproduces the committed one, the archive rebuilds byte-identically, extracting it
  # round-trips the manifest 68/68 via the parity module, and no build step leaves the
  # working tree dirty. Archive verification uses --no-manifest so it never rewrites the
  # tracked manifest. The dist zip itself is regenerable and not committed.
  #
  # fetch-depth: 0 — the inventory tests classify bundle members against a FIXED base
  # commit (a33c665) via git ls-tree/cat-file. A shallow checkout would not contain that
  # commit, so the full history is fetched.
  engine-source-ssot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for fixed-base-ref inventory tests)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure the inventory tests' fixed base commit is present
        run: |
          # The inventory tests read tracked blobs at this exact commit. fetch-depth: 0
          # normally provides it; fetch explicitly as a belt-and-suspenders guard so the
          # job never silently falls back to a shallow tree that lacks it.
          BASE=a33c66577ed072a021f4b3ec8713baf12a4239af
          git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "$BASE"
          git cat-file -e "$BASE^{commit}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run engine tests from the reviewable source (zero-dependency)
        working-directory: runtime/v7/engine
        run: npm test

      - name: Run the engine metadata + symlink contract tests
        run: node --test runtime/v7/tests

      - name: Run the legacy-bundle inventory + frozen-lock tests
        # Inventory tests depend on the fixed base commit ensured above.
        run: node --test runtime/v7/legacy-bundle

      - name: Assert the committed manifest is current (determinism gate)
        run: |
          set -e
          cp runtime/v7/engine.manifest.json /tmp/committed-manifest.json
          # Regenerate the manifest to a scratch path (never touching the tracked file)
          # and pin promotedFromCommit to the committed value so the provenance field
          # never causes a spurious diff — we are gating file paths + hashes, not commit.
          SRC="$(python3 -c "import json;print(json.load(open('/tmp/committed-manifest.json'))['promotedFromCommit'])")"
          node runtime/v7/build-engine-archive.mjs --no-zip \
            --manifest-out /tmp/regen-manifest.json --promoted-from "$SRC"
          diff -u /tmp/committed-manifest.json /tmp/regen-manifest.json \
            || (echo "engine.manifest.json is stale — run: node runtime/v7/build-engine-archive.mjs and commit" && exit 1)

      - name: Verify deterministic archive + round-trip parity (authority chain)
        run: |
          set -e
          # Build twice with --no-manifest so archive verification never rewrites the
          # tracked manifest; the archive must be byte-identical across builds.
          node runtime/v7/build-engine-archive.mjs --no-manifest >/dev/null
          sha1="$(sha256sum runtime/v7/dist/rain-push-v7-engine.zip | cut -d' ' -f1)"
          node runtime/v7/build-engine-archive.mjs --no-manifest >/dev/null
          sha2="$(sha256sum runtime/v7/dist/rain-push-v7-engine.zip | cut -d' ' -f1)"
          test "$sha1" = "$sha2" || (echo "archive is not reproducible: $sha1 != $sha2" && exit 1)
          echo "archive sha256: $sha1"
          # Extract and verify every file's SHA-256 against the manifest (round-trip),
          # using the unit-tested parity module — this is the guard that actually protects
          # the authority chain (source -> manifest -> generated archive).
          rm -rf /tmp/rt && mkdir -p /tmp/rt
          unzip -q runtime/v7/dist/rain-push-v7-engine.zip -d /tmp/rt
          node runtime/v7/verify-engine-bundle-parity.mjs \
            runtime/v7/engine.manifest.json \
            /tmp/rt/runtime/v7/engine
          # Extracted engine must run green too.
          (cd /tmp/rt/runtime/v7/engine && npm test)

      - name: Assert a clean working tree (no build step mutated tracked files)
        run: |
          # The determinism gate and archive verification must not modify any tracked
          # file (the dist zip is gitignored). If anything changed, a build step wrote
          # into the tree — fail loudly rather than passing on a dirty tree.
          git status --porcelain
          git diff --exit-code
          git diff --cached --exit-code

  # Identity + consumability guard for the FROZEN legacy artifact. The root
  # rain-push-v7-claude-handoff.zip is frozen (Option B): pinned by identity, NOT
  # synchronized with the live engine (its embedded engine is a historical snapshot and is
  # deliberately not parity-checked against the current manifest).
  #   - identity:      the on-disk artifact is byte-for-byte the frozen one — existence,
  #                    size, SHA-256, git blob SHA-1, central/file/directory counts, and
  #                    lock version — plus the lock-contract invariants (lifecycle,
  #                    artifactPath, path safety, field formats) via the verifier + its
  #                    adversarial test suite.
  #   - consumability: the frozen bundle still unpacks to a runnable engine — the embedded
  #                    historical engine's own test suite must pass 228/0. This proves the
  #                    frozen artifact remains a usable handoff, without restoring any
  #                    parity between it and the live engine.
  legacy-bundle-frozen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify the frozen legacy bundle against its lock (identity)
        run: node runtime/v7/legacy-bundle/verify-legacy-bundle.mjs

      - name: Run the frozen-bundle verifier's adversarial test suite (identity)
        run: node --test runtime/v7/legacy-bundle/verify-legacy-bundle.test.mjs

      - name: Verify the frozen bundle is still consumable (embedded engine 228/0)
        run: |
          # Unpack the frozen artifact and run its embedded historical engine's own
          # suite. This is a consumability check on the FROZEN snapshot — it does NOT
          # compare the embedded engine to the live engine (that parity was intentionally
          # removed when the bundle was frozen).
          rm -rf /tmp/legacy-bundle
          mkdir -p /tmp/legacy-bundle
          unzip -q rain-push-v7-claude-handoff.zip -d /tmp/legacy-bundle
          test -f /tmp/legacy-bundle/runtime/v7/engine/package.json
          (cd /tmp/legacy-bundle/runtime/v7/engine && npm test)

  # The P0-A corpus contract at runtime/v7/corpus/. This is the provenance + policy + IO
  # layer for the character corpus: schemas, the SSOT source-policy, the cross-record
  # validator, and the deterministic migration / public-export / privacy-scan tools.
  #
  # It runs fully OFFLINE with ZERO production dependencies (the schemas and validators are
  # hand-rolled precisely so this job needs no npm install and no network/LLM). The job:
  #   - runs the whole node:test suite (schema meta-validation, cross-record validator,
  #     migration, deterministic import/export, privacy/export leak, filesystem-safety +
  #     CLI exit-code, and the negative/adversarial cases);
  #   - re-runs the migration + export tools over the committed golden outputs and asserts
  #     a clean working tree, so any non-determinism or accidental in-tree write fails CI.
  # No engine, legacy-bundle, or dist artifacts are touched here.
  corpus-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Assert the corpus contract has no production dependencies
        run: |
          # The contract is deliberately zero-dependency so this job stays offline. If a
          # package.json with dependencies is ever added under runtime/v7/corpus/, fail —
          # a dependency must be introduced deliberately and pinned, not by accident.
          if [ -f runtime/v7/corpus/package.json ]; then
            node -e "const p=require('./runtime/v7/corpus/package.json'); const d={...(p.dependencies||{})}; if(Object.keys(d).length){console.error('unexpected production dependencies:',d); process.exit(1)}"
          fi

      - name: Run the corpus-contract test suite (offline, zero-dependency)
        run: node --test runtime/v7/corpus/tests

      - name: Re-run migration + export tools and assert deterministic, clean tree
        run: |
          set -e
          # Regenerate the committed golden artifacts in place; deterministic tools must
          # reproduce them byte-for-byte, so the working tree stays clean.
          node runtime/v7/corpus/bin/migrate.mjs \
            --in runtime/v7/corpus/fixtures/corpus.v0_1.json \
            --out-registry runtime/v7/corpus/fixtures/expected/migrated-registry.json \
            --out-events   runtime/v7/corpus/fixtures/expected/migrated-events.json
          node runtime/v7/corpus/bin/export-public.mjs \
            --registry runtime/v7/corpus/fixtures/registry.valid.json \
            --events   runtime/v7/corpus/fixtures/events.valid.json \
            --out      runtime/v7/corpus/fixtures/expected/public-export.json
          git status --porcelain runtime/v7/corpus
          git diff --exit-code -- runtime/v7/corpus

      - name: Prove the public export carries no private verbatim
        run: |
          # Export to a scratch path and scan it against the private events. Any verbatim
          # or private-only field in public output fails the job.
          node runtime/v7/corpus/bin/export-public.mjs \
            --registry runtime/v7/corpus/fixtures/registry.valid.json \
            --events   runtime/v7/corpus/fixtures/events.valid.json \
            --out /tmp/corpus-public.json
          node runtime/v7/corpus/bin/privacy-scan.mjs \
            --private runtime/v7/corpus/fixtures/events.valid.json \
            --public  /tmp/corpus-public.json
